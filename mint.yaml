version: 1
name: Zillow
slug: zillow
summary: >-
  Zillow real-estate access for Claude — search listings, fetch property
  details, Zestimate history, saved searches & homes, market reports
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches its site through the user's signed-in
# tab via the fetchproxy bridge. A bridged registration also needs runtime
# `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are registration
# fields this manifest has no schema for (set them over the control API).
# `state.dataDir` below is required for `bridge`.
env:
  - name: ZILLOW_WS_PORT
    required: false
    help: >-
      Override the fetchproxy WebSocket port (default 37149).
  - name: ZILLOW_LOCALITY_ALIASES_FILE
    required: false
    help: >-
      Path to a JSON file of locality alias pairs (e.g. [["Lake
      Lure","Rutherfordton"]]), registered both ways when resolving addresses
      whose postal locality differs from the place name. Overrides the built-in
      defaults.
  - name: ZILLOW_COMMUNITIES_FILE
    required: false
    help: >-
      Path to a JSON file overriding the built-in community-name vocabulary
      used when recognising community names in listing prose.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  # Only hosts the SERVER process actually fetches. Hosts that appear
  # solely in a URL this server BUILDS and returns are excluded.
  #
  # This server has ONE mode, the browser bridge: every zillow.com request
  # (src/client.ts → src/transport-fetchproxy.ts) is dialled by the user's
  # signed-in tab, and the process itself only opens the loopback
  # concentrator port the runner's agent connects to. There is no direct /
  # bootstrap / anonymous path, so the process dials nothing outbound — the
  # www.zillow.com literals in src/tools/*.ts are URLs it builds and returns.
  allow: []
